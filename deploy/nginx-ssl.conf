# =====================================================================
# P-Sale Ultra Cloud — Nginx TLS termination (بديل Caddyfile)
# يفترض: حاوية web (nginx) تعمل على الشبكة الداخلية بمنفذ 80
# وتُمرِّر /api و /socket.io إلى server:3005.
# هذا الملف يقع أمامها فقط لإنهاء TLS.
# الاستخدام: ضع الشهادات ثم أدرجه عبر docker run أو mount في nginx مضيف.
# =====================================================================
server {
    listen 80;
    server_name psale.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name psale.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # أمان عام
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # كل الطلبات تمر إلى حاوية الويب (nginx الداخلية التي تعرف /api و /socket.io)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
